<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 90" width="395" height="90" fill="none">
  <defs>
    <linearGradient id="lightAmber" x1="42" y1="24" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Container Box (Light) -->
  <rect width="395" height="90" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />

  <!-- Monogram Mark -->
  <!-- Left Upper Wing of Y (Dark Slate) -->
  <path
    d="M 21 24 L 45 53"
    stroke="#09090B"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Integrated L-Spine (Amber Accent) -->
  <path
    d="M 69 24 L 45 53 V 72 H 69"
    stroke="url(#lightAmber)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="45" cy="53" r="2.8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" />

  <!-- Subtle Vertical Rule -->
  <line x1="96" y1="24" x2="96" y2="66" stroke="#E4E4E7" stroke-width="1.5" />

  <!-- Typography -->
  <g transform="translate(118, 0)">
    <text x="0" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" letter-spacing="0.12em" fill="#09090B">YUVITRA</text>
    <text x="148" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700" letter-spacing="0.12em" fill="#D97706">LABS</text>

    <!-- Subtitle / Industrial Engineering Descriptor -->
    <text x="1" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.2" font-weight="600" letter-spacing="0.14em" fill="#71717A">INDUSTRIAL SOFTWARE &amp; DIGITAL ENGINEERING</text>
  </g>
</svg>
