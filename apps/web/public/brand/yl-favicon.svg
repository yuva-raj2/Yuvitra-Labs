<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Industrial Squircle Container -->
  <rect width="32" height="32" rx="7" fill="#090A0F" stroke="#27272A" stroke-width="1" />
  
  <!-- Subtle Amber Backlight -->
  <circle cx="16" cy="16" r="8" fill="#F59E0B" opacity="0.15" />

  <!-- Left Upper Wing of Y -->
  <path
    d="M 7.5 8 L 16 17.5"
    stroke="#F4F4F5"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Integrated L-Spine (Right Arm -> Stem -> Foot) -->
  <path
    d="M 24.5 8 L 16 17.5 V 24 H 24.5"
    stroke="#F59E0B"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Nexus Hub Point -->
  <circle cx="16" cy="17.5" r="1.1" fill="#090A0F" />
</svg>
